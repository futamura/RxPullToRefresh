name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project RxPullToRefresh.xcodeproj \
            -scheme RxPullToRefresh \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -only-testing:RxPullToRefreshTests \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO | xcbeautify
      # No -derivedDataPath above: the uploader's xcode plugin looks for the
      # profdata under the default DerivedData location, then runs llvm-cov
      # over the framework binary it finds beside it.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          swift_project: RxPullToRefresh
          flags: unittests
          fail_ci_if_error: false

  build-example:
    name: Build example app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Build example
        run: |
          set -o pipefail
          xcodebuild build \
            -project RxPullToRefresh.xcodeproj \
            -scheme RxPullToRefreshExample \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | xcbeautify

  ui-test:
    name: UI tests
    # Drives the simulator for ~15 minutes, so keep it off pull requests.
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    # The suite runs in ~20 minutes. Two runs have instead wedged until the
    # job was killed, so the per-test allowance below is the real guard and
    # this ceiling is only a backstop. The slowest case measures 130 seconds
    # because it pays for the simulator coming up, hence the roomy allowance:
    # a wedge should trip it, a cold runner should not.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Run UI tests
        run: |
          # No xcbeautify here, unlike the unit test job: it block-buffers its
          # own stdout when that is a pipe, so the run printed nothing for the
          # eighteen minutes the tests were executing and a wedge looked the
          # same as healthy progress. Raw output with NSUnbufferedIO streams,
          # which is worth the noise on a job that has hung twice.
          NSUnbufferedIO=YES xcodebuild test \
            -project RxPullToRefresh.xcodeproj \
            -scheme RxPullToRefresh \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -only-testing:RxPullToRefreshUITests \
            -enableCodeCoverage YES \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 300 \
            -maximum-test-execution-time-allowance 300 \
            CODE_SIGNING_ALLOWED=NO
      # Same as the unit test job: no -derivedDataPath, or the uploader finds
      # no profdata and silently reports zero coverage. Runs even when a case
      # failed, because the cases that did pass still measured the framework.
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          swift_project: RxPullToRefresh
          flags: uitests
          fail_ci_if_error: false

  lint:
    name: SwiftLint
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/realm/swiftlint:latest
    steps:
      - uses: actions/checkout@v7
      - name: Run SwiftLint
        run: swiftlint lint --reporter github-actions-logging
